<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FrameWise Camera v0.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f5;background:#101317}*{box-sizing:border-box}body{margin:0}.app{max-width:700px;min-height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;margin:0}.top span,.meta{color:#aab9c2;font-size:12px}.stage{position:relative;background:#030505;border-radius:18px;overflow:hidden;min-height:55dvh;max-height:72dvh;flex:1;display:grid;place-items:center}.stage video{width:100%;height:100%;object-fit:contain;display:block}.overlay{position:absolute;inset:0;pointer-events:none}.gridline{position:absolute;background:#ffffff80}.v{top:0;bottom:0;width:1px}.h{left:0;right:0;height:1px}.v.a{left:33.333%}.v.b{left:66.667%}.h.a{top:33.333%}.h.b{top:66.667%}.level{position:absolute;left:50%;top:50%;width:92px;height:2px;background:#fff;transform:translate(-50%,-50%)}.level:after{content:"";position:absolute;border:2px solid #90ffbf;border-radius:50%;width:10px;height:10px;left:calc(50% - 5px);top:-5px}.corner,.hint{position:absolute;background:#0b1012c9;padding:8px 10px;border-radius:10px;font-size:12px}.corner{top:10px;left:10px}.hint{bottom:12px;left:10px;right:10px;text-align:center}.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}button,.save{color:#f2f4f4;background:#283039;border:1px solid #53616c;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;text-decoration:none}button:disabled{opacity:.4}.capture{width:76px;height:76px;border-radius:50%;background:#f7faf8;box-shadow:0 0 0 3px #6e8b83;border:6px solid #172323;touch-action:none;user-select:none;-webkit-user-select:none}.capture.pressed{background:#8df4c7}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.meta{line-height:1.5}#result{max-width:100%;max-height:210px;border-radius:10px;display:none;margin:auto}#save{display:none;background:#aff0ca;color:#103a28}#canvas{display:none}input{accent-color:#98edbb}
</style></head><body><main class="app"><header class="top"><h1>FrameWise <span>v0.2 · 화질 개선</span></h1><span>LOCAL</span></header><section class="stage" id="stage"><video id="video" autoplay playsinline muted></video><div class="overlay" id="overlay"><div class="gridline v a"></div><div class="gridline v b"></div><div class="gridline h a"></div><div class="gridline h b"></div><div class="level" id="level"></div></div><div class="corner" id="quality">카메라 꺼짐</div><div class="hint" id="hint">탭: 원본 촬영 · 길게 누르기: 자동 보정 촬영</div></section><div class="controls"><button id="start">카메라 켜기</button><button id="flip" disabled>전후면 전환</button><button id="tilt">수평계</button><button class="capture" id="shot" disabled aria-label="촬영 버튼"></button></div><div class="row"><label><input type="checkbox" id="grid" checked> 구도선</label><span id="quota">무료 보정 잔여 10/10</span></div><div class="meta" id="message">미리보기는 원본 영상으로 표시해 끊김을 줄이고, 사진을 찍을 때만 자동 보정합니다.</div><canvas id="canvas"></canvas><img id="result" alt="촬영 결과"><a class="save" id="save" download="framewise-photo.jpg">촬영 사진 저장</a><div class="meta">사진은 기기에서 처리됩니다. 미리보기의 화질과 저장 사진의 해상도는 다를 수 있어요. 웹 브라우저는 아이폰 기본 카메라의 모든 촬영 기능을 지원하지 않습니다. 실제 AI 장면 인식·프로 결제는 미구현입니다.</div></main><script>
'use strict';const $=id=>document.getElementById(id);const video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let stream=null,facing='environment',url=null,pressTimer=null,longFired=false,pressStart=0,busy=false,angle=null;
function day(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function used(){try{return Number(localStorage.getItem('framewise_used_'+day())||0)}catch(e){return 0}}
function inc(){try{localStorage.setItem('framewise_used_'+day(),String(used()+1))}catch(e){}updateQuota()}
function updateQuota(){$('quota').textContent=`무료 보정 잔여 ${Math.max(0,10-used())}/10`};updateQuota();
function msg(s){$('message').textContent=s}
async function start(){try{$('shot').disabled=true;if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160}}});video.srcObject=stream;await video.play();$('shot').disabled=false;$('flip').disabled=false;const track=stream.getVideoTracks()[0],settings=track.getSettings();$('quality').textContent=`${settings.width||video.videoWidth} × ${settings.height||video.videoHeight} 영상`;msg('미리보기는 보정 없이 표시합니다. 탭은 원본, 0.5초 이상 길게 누르면 보정된 사진이 저장됩니다.')}catch(e){msg('카메라 오류: '+e.message)}}
$('start').onclick=start;$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};$('grid').onchange=e=>document.querySelectorAll('.gridline').forEach(x=>x.style.display=e.target.checked?'':'none');
$('tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('센서 미지원');if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')return msg('센서 권한을 허용해야 합니다.')}window.addEventListener('deviceorientation',e=>{if(e.gamma==null)return;angle=e.gamma;$('level').style.transform=`translate(-50%,-50%) rotate(${-angle}deg)`;$('level').style.background=Math.abs(angle)<2?'#8cffc1':'#fff'},{passive:true});msg('수평계 활성화. 초록 선이면 대략 수평입니다.')}catch(e){msg('수평계 오류: '+e.message)}};
function filterForScene(){// Lightweight image histogram, not a trained scene-classification model.
 const sm=document.createElement('canvas');sm.width=40;sm.height=30;const sc=sm.getContext('2d',{willReadFrequently:true});sc.drawImage(video,0,0,40,30);const p=sc.getImageData(0,0,40,30).data;let lum=0,bright=0,dark=0,n=0;for(let i=0;i<p.length;i+=4){const l=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];lum+=l;if(l>205)bright++;if(l<45)dark++;n++}const avg=lum/n;let b=1,c=1.065,s=1.09;if(avg<65){b=1.06;c=1.12;s=1.08}else if(avg<110){b=1.09;c=1.07}else if(avg>175){b=.94;c=1.055}else{b=1.035}if(dark/n>.58){b=Math.min(b,1.055);c=1.10}if(bright/n>.26){b=Math.min(b,1.00)}return `brightness(${b}) contrast(${c}) saturate(${s})`}
async function shot(enhance){if(busy||video.readyState<2)return;if(enhance&&used()>=10){msg('오늘 무료 보정 10장을 모두 사용했어요. 원본 촬영은 가능해요. (실제 Pro 결제는 아직 구현되지 않았습니다.)');return}busy=true;$('shot').disabled=true;try{const w=video.videoWidth,h=video.videoHeight;if(!w||!h)throw Error('영상 해상도를 가져올 수 없습니다.');canvas.width=w;canvas.height=h;ctx.filter=enhance?filterForScene():'none';ctx.drawImage(video,0,0,w,h);ctx.filter='none';const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('JPEG 생성 실패')),'image/jpeg',.95));if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('result').src=url;$('result').style.display='block';$('save').href=url;$('save').download=`framewise-${enhance?'enhanced':'original'}-${Date.now()}.jpg`;$('save').style.display='block';if(enhance)inc();msg(`${enhance?'자동 보정':'원본'} 촬영 완료 · ${w}×${h} · ${(blob.size/1024/1024).toFixed(1)}MB. 아래 저장을 누르세요.`)}catch(e){msg('촬영 실패: '+e.message)}finally{busy=false;$('shot').disabled=false}}
const btn=$('shot');btn.addEventListener('pointerdown',e=>{if(btn.disabled)return;longFired=false;pressStart=Date.now();btn.classList.add('pressed');try{btn.setPointerCapture(e.pointerId)}catch(e){}pressTimer=setTimeout(()=>{longFired=true},500)});btn.addEventListener('pointerup',e=>{if(!pressStart)return;clearTimeout(pressTimer);btn.classList.remove('pressed');const enhanced=longFired||Date.now()-pressStart>=500;pressStart=0;shot(enhanced)});btn.addEventListener('pointercancel',()=>{clearTimeout(pressTimer);pressStart=0;btn.classList.remove('pressed')});btn.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());if(url)URL.revokeObjectURL(url)});
</script></body></html>
